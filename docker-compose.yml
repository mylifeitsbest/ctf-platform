      - TEAM=team3
    ports:
      - "5306:5000"
    networks: [adnet]
    restart: unless-stopped
  scoreboard:
    build: ./gameserver/scoreboard
    container_name: scoreboard
    hostname: scoreboard
    environment:
      - FLAG_REGEX=[A-Z0-9]{31}=
      - FLAG_TTL_ROUNDS=5
    ports:
      - "8080:8080"
    networks: [adnet]
    restart: unless-stopped
  checker:
    build: ./gameserver/checker
    container_name: checker
    environment:
      - ROUND_TIME=30
      - FLAG_REGEX=[A-Z0-9]{31}=
      - SCOREBOARD=http://scoreboard:8080
    depends_on: [scoreboard]
    networks: [adnet]
    restart: unless-stopped
  portal:
    build: ./portal
    container_name: portal
    environment:
      - SCOREBOARD=http://scoreboard:8080
      - PUBLIC_HOST=localhost
      - SECRET=dojo-portal-secret
    ports:
      - "9000:9000"
    depends_on: [scoreboard]
    networks: [adnet]
    restart: unless-stopped
  attacker_bot:
    build: ./gameserver/attacker_bot
    container_name: attacker_bot
    environment:
      - ROUND_TIME=30
      - FLAG_REGEX=[A-Z0-9]{31}=
      - SCOREBOARD=http://scoreboard:8080
      - TEAM=attacker_bot
    depends_on: [scoreboard]
    networks: [adnet]
    restart: unless-stopped
networks:
  adnet:
    driver: bridge
